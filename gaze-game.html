<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>星点捕手 · GazeTouch 学习游戏</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#172a50,#080e1b 72%);color:#eef8ff;font:15px system-ui;padding:18px}main{max-width:650px;margin:auto}h1{font-size:30px;margin:8px 0}p{color:#b0bfd6;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}button{background:#70e4c6;color:#072b26;border:0;border-radius:12px;padding:12px 14px;font-weight:700}button.alt{background:#233958;color:#e0efff}button:disabled{opacity:.42}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#1c2b43;border:1px solid #334664;border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}.stat small{color:#b0bfd6}.board{position:relative;width:100%;height: min(57vh,530px);min-height:330px;border:1px solid #38567b;background:radial-gradient(circle at 60% 35%,#1a3152,#10192b);border-radius:19px;overflow:hidden;touch-action:manipulation}.star{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:2px solid #fbe6a2;background:radial-gradient(circle at 30% 25%,#fff3b0,#e4a544 55%,#8a5724);box-shadow:0 0 28px #ffce7c66;color:#472900;font-size:32px}.star:active{transform:translate(-50%,-50%) scale(.92)}.marker{position:absolute;width:18px;height:18px;border:2px solid #69efff;border-radius:50%;background:#69efff22;transform:translate(-50%,-50%);pointer-events:none;display:none}.msg{min-height:48px;background:#18283e;padding:12px;border-radius:12px;margin:12px 0;color:#d1e1f1}.note{font-size:12px}.bar{height:6px;background:#2b405c;border-radius:6px;overflow:hidden}.bar>i{display:block;background:#71e3c9;height:100%;width:0}#video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}a{color:#8de4d2}</style></head><body><main><small style="color:#81dcc9">GAZETOUCH · LEARNING GAME 1.0</small><h1>✦ 星点捕手</h1><p>眼睛看向星星，再轻点它得分。每次有效命中会采集少量眼部特征作为校准样本，逐步学习你的视线映射。玩法过程中无需逐个点击九点校准。</p><div class="row"><button id="start">授权摄像头并开始</button><button id="pause" class="alt" disabled>暂停</button><button id="export" class="alt">导出本地数据</button><button id="clear" class="alt">清除学习数据</button></div><div class="stats"><div class="stat"><small>得分</small><b id="score">0</b></div><div class="stat"><small>训练样本</small><b id="samples">0</b></div><div class="stat"><small>验证误差</small><b id="error">—</b></div></div><div class="bar"><i id="progress"></i></div><div id="message" class="msg">摄像头默认关闭。只有点击“授权摄像头并开始”才会采集眼部关键点。所有数据默认仅保留在此浏览器。</div><div id="board" class="board"><button id="star" class="star" style="left:50%;top:50%" disabled aria-label="点击星星">✦</button><div id="marker" class="marker"></div></div><video id="video" autoplay muted playsinline></video><p class="note">建议：手机与眼睛保持约30–45厘米距离，先看清星星再点击。蓝色圆点是预测位置，不代表真实视线。点击时会保留训练数据；原始图像不会保存。新样本有噪声时，精度未必改善。</p><p class="note"><a href="./interaction-v10.html">返回 V1.0 交互器</a></p></main><script type="module">
const $=s=>document.getElementById(s);let stream=null,detector=null,running=false,paused=false,frames=0,score=0,features=null,history=[],train=[],holdout=[],position={x:.5,y:.5},lastSample=0,lastInfer=0,raf=0,smoothed=null;
const key='gazetouch-game-v1',maxSamples=360;
try{const prev=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(prev))train=prev.filter(s=>Array.isArray(s.f)&&s.f.length===6&&s.f.every(Number.isFinite)&&Number.isFinite(s.x)&&Number.isFinite(s.y)).slice(-maxSamples)}catch{}
function message(m){$('message').textContent=m}function update(){ $('score').textContent=score;$('samples').textContent=train.length;$('progress').style.width=Math.min(100,train.length/90*100)+'%';if(holdout.length){const e=holdout.map(s=>{let p=predict(s.f);return p?Math.hypot((p.x-s.x)*$('board').clientWidth,(p.y-s.y)*$('board').clientHeight):NaN}).filter(Number.isFinite);$('error').textContent=e.length?Math.round(e.reduce((a,b)=>a+b,0)/e.length)+'px':'—'}}function store(){try{localStorage.setItem(key,JSON.stringify(train.slice(-maxSamples)))}catch{message('浏览器存储受限，本次样本暂存在内存中')}window.GazeGameBridge?.onSample?.()}
function getFeature(l){const p=i=>l[i],ratio=(idx,a,b,c,d)=>[(p(idx).x-p(a).x)/(p(b).x-p(a).x||1),(p(idx).y-p(c).y)/(p(d).y-p(c).y||1)];let a=ratio(468,33,133,159,145),b=ratio(473,362,263,386,374);return [1,(a[0]+b[0])/2,(a[1]+b[1])/2,p(1).x,p(1).y,Math.hypot(p(33).x-p(263).x,p(33).y-p(263).y)]}
function dist(a,b){return Math.sqrt(a.slice(1).reduce((z,v,i)=>z+(v-b[i+1])**2,0))}function predict(f){if(train.length<8)return null;let near=train.map(s=>({s,d:dist(f,s.f)})).sort((a,b)=>a.d-b.d).slice(0,Math.min(9,train.length));const scale=Math.max(.008,near[Math.floor(near.length/2)].d);let total=0,x=0,y=0;for(let z of near){let w=Math.exp(-Math.pow(z.d/scale,2)*1.8);total+=w;x+=z.s.x*w;y+=z.s.y*w}return total?{x:x/total,y:y/total}:null}
function stable(){const h=history.filter(s=>performance.now()-s.t<700);if(h.length<5)return null;let f=Array.from({length:6},(_,i)=>h.reduce((a,s)=>a+s.f[i],0)/h.length);let scatter=Math.sqrt(h.reduce((a,s)=>a+dist(f,s.f)**2,0)/h.length);return scatter<.042?f:null}
function next(){position={x:.1+Math.random()*.8,y:.1+Math.random()*.8};$('star').style.left=position.x*100+'%';$('star').style.top=position.y*100+'%'}
function loop(t){if(!running)return;if(!paused&&detector&&$('video').readyState>=2&&t-lastInfer>110){lastInfer=t;try{const res=detector.detectForVideo($('video'),t);frames++;if(res.faceLandmarks?.length){features=getFeature(res.faceLandmarks[0]);history.push({t,f:features});history=history.filter(s=>t-s.t<800);const p=predict(features);if(p){smoothed=smoothed?{x:smoothed.x*.75+p.x*.25,y:smoothed.y*.75+p.y*.25}:p;$('marker').style.display='block';$('marker').style.left=smoothed.x*100+'%';$('marker').style.top=smoothed.y*100+'%'}}else{features=null;history=[];$('marker').style.display='none'}}catch(e){message('识别错误：'+e.message);paused=true}}raf=requestAnimationFrame(loop)}
$('star').onclick=()=>{if(!running||paused)return;const f=stable();score++;const sample=f?{f,x:position.x,y:position.y}:null;if(sample){if(score%5===0){holdout.push(sample);if(holdout.length>30)holdout.shift()}else{train.push(sample);if(train.length>maxSamples)train.shift();store()}message('命中！'+(train.length<8?' 正在收集初始校准样本…':' 蓝点是模型预测，继续玩可逐步补足屏幕区域数据。'))}else message('命中！本次眼睛不够稳定，未计入训练样本。');update();next()};
$('start').onclick=async()=>{if(running)return;$('start').disabled=true;message('请求摄像头并加载模型，请稍等…');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;await $('video').play();const v=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs');const files=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm');detector=await v.FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1});running=true;paused=false;$('pause').disabled=false;$('star').disabled=false;message('游戏开始！看向星星，再点击它。');next();raf=requestAnimationFrame(loop)}catch(e){message('启动失败：'+e.message);stream?.getTracks().forEach(t=>t.stop());stream=null;$('start').disabled=false}};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停';$('star').disabled=paused;message(paused?'已暂停，仍可关闭网页停止摄像头':'继续游戏')};
$('clear').onclick=()=>{if(!confirm('确定清除本地训练和验证样本吗？'))return;train=[];holdout=[];score=0;smoothed=null;localStorage.removeItem(key);update();message('学习数据已清除。')};
$('export').onclick=()=>{const data=JSON.stringify({version:1,training:train,validation:holdout},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gazetouch-local-samples.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
function stop(){running=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;detector?.close?.();detector=null}window.GazeGameBridge={get:()=>train.map(s=>({f:[...s.f],x:s.x,y:s.y})),set:samples=>{train=samples.slice(-maxSamples);store();update()},onSample:null};addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){paused=true;$('pause').textContent='继续';$('star').disabled=true}});update();
</script><script type="module" src="./cloud-sync.js"></script></body></html>
