<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GazeTouch · MediaPipe 测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1221;color:#e9f4f9;font:15px system-ui;padding:18px}main{max-width:660px;margin:auto}h1{font-size:28px;margin:8px 0}.muted{color:#a7bbcd;line-height:1.55}.status{padding:13px;background:#202e42;border-radius:12px;white-space:pre-wrap;font:13px/1.7 monospace;margin:12px 0}button{background:#63d3bd;color:#062822;border:0;border-radius:12px;padding:13px;font:700 14px system-ui}button.secondary{background:#263c55;color:#eef}button:disabled{opacity:.4}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.video{position:relative;background:#141f2e;border-radius:16px;overflow:hidden;min-height:160px;max-width:340px;margin:auto}video{width:100%;display:block;transform:scaleX(-1)}.video canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.tile{min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #384960;background:#1a2940;border-radius:16px;padding:12px;transition:border-color .2s}.tile.active{border-color:#63d3bd}.tile b{font-size:24px}.pad{border:1px solid #51778a;background:#172f41;padding:23px;border-radius:16px;text-align:center;touch-action:none;user-select:none;margin:20px 0}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#090f1af7;z-index:8}.point{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#76e4ca}.float{position:fixed;width:18px;height:18px;border:2px solid #f5d46d;background:#f5d46d55;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:6}a{color:#78dcca}
</style></head><body><main><small style="color:#63d3bd">GAZETOUCH / DIAGNOSTIC 0.5 · FIXED IMPORT</small><h1>用眼睛选，用手指动</h1><p class="muted">这是独立于 WebGazer 的 MediaPipe 方案。先检测眼睛，再做九点校准。数据只在当前浏览器处理；摄像头需手动授权。</p>
<div class="row"><button id="start">启动摄像头和眼部识别</button><button id="cal" class="secondary" disabled>九点校准</button><button id="stop" class="secondary" disabled>关闭</button></div><div id="state" class="status">版本 0.5 · 等待启动</div>
<div class="video"><video id="cam" autoplay muted playsinline></video><canvas id="canvas"></canvas></div>
<div class="tiles" id="tiles"><div class="tile active" data-n="0"><b>◈</b>几何</div><div class="tile" data-n="1"><b>◉</b>光谱</div><div class="tile" data-n="2"><b>▥</b>数据</div><div class="tile" data-n="3"><b>Aa</b>文字</div></div>
<div id="pad" class="pad">在此按住并左右滑动，改变选中的内容<br><span id="val">强度：50</span></div>
<p class="muted" id="hint">没有校准时，点击卡片可手动选择；完成校准后，可用注视选择。</p>
<p class="muted">如果检测帧保持 0，请将诊断框截图发给我。浏览器建议 Chrome；也可对比其他浏览器。</p></main><div id="dot" class="float"></div><div id="overlay" class="overlay" hidden><p style="padding:10px">依次注视光点并点击，每点点击 2 次；固定手机位置。<button id="cancel" class="secondary">取消</button><span id="progress"></span></p><button class="point" id="point">点击</button></div>
<script type="module">
const $=id=>document.getElementById(id);let vision=null,landmarker=null,stream=null,active=false,frames=0,detected=0,lastAt=0,raf=0,selected=0,lock=null,downX=0,downValue=50,values=[50,50,50,50],features=null,train=[],weights=null,calIndex=0,calClick=0,lastError='',gaze={x:0,y:0},candidate=-1,candidateAt=0;const cards=[...document.querySelectorAll('.tile')];const points=[[.12,.19],[.50,.19],[.88,.19],[.12,.49],[.50,.49],[.88,.49],[.12,.79],[.50,.79],[.88,.79]];
function status(s){$('state').textContent='阶段：'+s+'\n检测帧：'+frames+' · 识别到眼睛：'+detected+'\n最后错误：'+(lastError||'无')+'\n校准样本：'+train.length}
function sel(i){if(lock!==null||i<0||i>=4)return;selected=i;cards.forEach((c,j)=>c.classList.toggle('active',i===j));$('val').textContent='强度：'+Math.round(values[i])}
cards.forEach((c,i)=>c.addEventListener('click',()=>sel(i)));
function feature(landmarks){const p=i=>landmarks[i];const ratio=(idx,left,right,top,bottom)=>{let l=p(left),r=p(right),a=p(top),b=p(bottom),c=p(idx);return [(c.x-l.x)/(r.x-l.x||1),(c.y-a.y)/(b.y-a.y||1)]};const l=ratio(468,33,133,159,145),r=ratio(473,362,263,386,374);const nose=p(1),outerL=p(33),outerR=p(263),dist=Math.hypot(outerL.x-outerR.x,outerL.y-outerR.y)||1;return [1,(l[0]+r[0])/2,(l[1]+r[1])/2,nose.x,nose.y,dist]}
function fit(samples){const n=6,A=Array.from({length:n},()=>Array(n).fill(0)),bx=Array(n).fill(0),by=Array(n).fill(0);for(const s of samples){for(let i=0;i<n;i++){bx[i]+=s.f[i]*s.x;by[i]+=s.f[i]*s.y;for(let j=0;j<n;j++)A[i][j]+=s.f[i]*s.f[j]}}for(let i=0;i<n;i++)A[i][i]+=.0001;function solve(b){let M=A.map((row,i)=>[...row,b[i]]);for(let k=0;k<n;k++){let m=k;for(let i=k+1;i<n;i++)if(Math.abs(M[i][k])>Math.abs(M[m][k]))m=i;[M[k],M[m]]=[M[m],M[k]];if(Math.abs(M[k][k])<1e-10)continue;let div=M[k][k];for(let j=k;j<=n;j++)M[k][j]/=div;for(let i=0;i<n;i++)if(i!==k){let f=M[i][k];for(let j=k;j<=n;j++)M[i][j]-=f*M[k][j]}}return M.map(r=>r[n])}return [solve(bx),solve(by)]}
function inference(){if(!weights||!features||!$('overlay').hidden)return;const predict=w=>w.reduce((acc,v,i)=>acc+v*features[i],0);const x=Math.min(innerWidth,Math.max(0,predict(weights[0]))),y=Math.min(innerHeight,Math.max(0,predict(weights[1])));gaze.x=gaze.x?gaze.x*.7+x*.3:x;gaze.y=gaze.y?gaze.y*.7+y*.3:y;$('dot').style.display='block';$('dot').style.left=gaze.x+'px';$('dot').style.top=gaze.y+'px';if(lock!==null)return;const el=document.elementFromPoint(gaze.x,gaze.y)?.closest?.('.tile');const i=el?Number(el.dataset.n):-1;if(i!==candidate){candidate=i;candidateAt=performance.now()}if(i>=0&&performance.now()-candidateAt>600)sel(i)}
function draw(l){const can=$('canvas'),vid=$('cam');if(can.width!==vid.videoWidth||can.height!==vid.videoHeight){can.width=vid.videoWidth;can.height=vid.videoHeight}const ctx=can.getContext('2d');ctx.clearRect(0,0,can.width,can.height);ctx.fillStyle='#70ffe3';for(const i of [33,133,159,145,468,362,263,386,374,473]){const p=l[i];ctx.beginPath();ctx.arc(p.x*can.width,p.y*can.height,Math.max(2,can.width/220),0,Math.PI*2);ctx.fill()}}
async function loop(){if(!active)return;const vid=$('cam');if(vid.readyState>=2&&vid.videoWidth>0){try{let now=performance.now();if(now-lastAt>90){lastAt=now;const res=landmarker.detectForVideo(vid,now);frames++;if(res.faceLandmarks?.length){features=feature(res.faceLandmarks[0]);detected++;draw(res.faceLandmarks[0]);inference()}else{features=null;$('canvas').getContext('2d').clearRect(0,0,$('canvas').width,$('canvas').height)}if(frames%10===0)status(res.faceLandmarks?.length?'面部和眼部已识别':'摄像头在运行，未识别到人脸')}}catch(e){lastError=e.message||String(e);status('推理失败');active=false;return}}raf=requestAnimationFrame(loop)}
$('start').onclick=async()=>{if(active)return;$('start').disabled=true;lastError='';status('请求摄像头');try{if(!isSecureContext)throw Error('需要 HTTPS');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('cam').srcObject=stream;await $('cam').play();status('加载 MediaPipe 模型');const v=await Promise.race([import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs'),new Promise((_,reject)=>setTimeout(()=>reject(new Error('MediaPipe 脚本加载超时，请检查网络连接')),16000))]);vision=v;const files=await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm');let opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:false};landmarker=await v.FaceLandmarker.createFromOptions(files,opts);active=true;$('cal').disabled=false;$('stop').disabled=false;status('识别已启动');loop()}catch(e){lastError=e?.message||String(e);if(lastError.includes('fetch dynamically imported module'))lastError+='。请尝试系统 Chrome 或检查 jsDelivr CDN 是否可访问。';status('启动失败');$('start').disabled=false;stream?.getTracks().forEach(t=>t.stop());stream=null;console.error(e)}};
$('stop').onclick=()=>{active=false;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;$('cam').srcObject=null;landmarker?.close?.();landmarker=null;features=null;weights=null;$('dot').style.display='none';$('start').disabled=false;$('cal').disabled=true;$('stop').disabled=true;status('已关闭')};
function pos(){let [x,y]=points[calIndex];$('point').style.left=x*100+'%';$('point').style.top=y*100+'%';$('progress').textContent=(calIndex+1)+'/9 · '+calClick+'/2'}
$('cal').onclick=()=>{if(!active)return;train=[];weights=null;calIndex=0;calClick=0;$('overlay').hidden=false;pos()};$('cancel').onclick=()=>{$('overlay').hidden=true};
$('point').onclick=()=>{if(!features){$('progress').textContent='未检测到眼睛，请调整脸部位置';return}const [x,y]=points[calIndex];train.push({f:[...features],x:innerWidth*x,y:innerHeight*y});calClick++;if(calClick>=2){calClick=0;calIndex++;if(calIndex>=9){weights=fit(train);$('overlay').hidden=true;$('hint').textContent='校准完毕。视线黄点是算法估计，可能有较大误差；请用眼睛选择卡片，手指滑动操作。';status('校准完成');return}}pos()};
const pad=$('pad');pad.onpointerdown=e=>{if(lock!==null)return;lock=selected;downX=e.clientX;downValue=values[lock];pad.setPointerCapture(e.pointerId)};pad.onpointermove=e=>{if(lock===null)return;values[lock]=Math.max(0,Math.min(100,downValue+(e.clientX-downX)/pad.clientWidth*100));$('val').textContent='强度：'+Math.round(values[lock]);cards[lock].style.transform='scale('+(0.94+values[lock]/900)+')';cards[lock].style.filter='hue-rotate('+((values[lock]-50)*4)+'deg)'};pad.onpointerup=pad.onpointercancel=()=>{lock=null};document.addEventListener('visibilitychange',()=>{if(document.hidden&&active)$('stop').click()});status('未启动');
</script></body></html>
